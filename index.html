  {id:"pen",label:"연금저축 ETF",color:"#378ADD",defM:50,defRt:9,maxM:300},
  {id:"irp",label:"IRP",color:"#639922",defM:30,defRt:7,maxM:300},
  {id:"etf",label:"해외 ETF (VOO)",color:"#BA7517",defM:100,defRt:10,maxM:300},
  {id:"sav",label:"적금·예금",color:"#888780",defM:54,defRt:3,maxM:300},
  {id:"bon",label:"상여·성과급 운용",color:"#534AB7",defM:230,defRt:8,maxM:700},
];
const BRACKETS=[
  {limit:1400,rate:0.06,ded:0},{limit:5000,rate:0.15,ded:126},
  {limit:8800,rate:0.24,ded:576},{limit:15000,rate:0.35,ded:1544},
  {limit:30000,rate:0.38,ded:1994},{limit:50000,rate:0.40,ded:2594},
  {limit:100000,rate:0.42,ded:3594},{limit:Infinity,rate:0.45,ded:6594},
];
function calcTax(sell,buy){
  const g=sell-buy;if(g<=0)return 0;
  const base=Math.max(0,g*10000-250);
  let t=0;for(const b of BRACKETS){if(base<=b.limit){t=base*b.rate-b.ded;break;}}
  return Math.max(0,t*1.1)/10000;
}
function calcTax1(sell,buy){
  const g=sell-buy;if(g<=0)return 0;if(sell<=12)return 0;
  const ratio=(sell-12)/sell;
  const base=Math.max(0,g*ratio*10000-250);
  let t=0;for(const b of BRACKETS){if(base<=b.limit){t=base*b.rate-b.ded;break;}}
  return Math.max(0,t*1.1)/10000;
}
function compSav(m,r,y){
  if(y<=0)return 0;const rv=r/100/12,n=Math.round(y*12);
  if(rv<1e-9)return m*n;return m*(Math.pow(1+rv,n)-1)/rv;
}
// 원리금균등상환 월납입액 계산 (억원 → 만원)
function calcMortgage(loan억, rateY, years){
  if(loan억<=0||years<=0)return 0;
  const P=loan억*10000; // 만원
  const r=rateY/100/12;
  if(r<1e-9)return P/(years*12);
  return P*r*Math.pow(1+r,years*12)/(Math.pow(1+r,years*12)-1);
}
function proj(b,r,y){return b*Math.pow(1+r/100,y);}
function f억(v){return(Math.round(v*10)/10).toFixed(1)+"억";}
function f억2(v){return(Math.round(v*100)/100).toFixed(2)+"억";}
function fM(v){return Math.round(v).toLocaleString()+"만";}
function fM2억(v){return(Math.round(v/1000)/10).toFixed(1)+"억";}
function f원(v){return Math.round(v).toLocaleString()+"원";}
function f원K(v){return(v>=10000?`${(v/10000).toFixed(1)}억`:`${Math.round(v/10000*100)/100}억`);}
function p1(v){const s=(Math.round(v*10)/10).toFixed(1);return(v>=0?"+":"")+s+"%";}
function p2(v){return(Math.round(v*100)/100).toFixed(2)+"%";}
function cagr(f,c,y){if(c<=0||y<=0||f<=0)return 0;return(Math.pow(f/c,1/y)-1)*100;}
function cumR(f,c){if(c<=0)return 0;return(f/c-1)*100;}
// 현재가치 환산
function pv(fv,inf,yrs){return fv/Math.pow(1+inf/100,yrs);}

}
function NInput({value,onChange,placeholder,width,step}){

}
function MC({label,value,sub,sub2,color}){
  const bg={blue:"#E6F1FB",green:"#EAF3DE",amber:"#FAEEDA",purple:"#EEEDFE",teal:"#E1F5EE",coral:"#FAECE7",indigo:"#EEF0FC",rose:"#FCEEF2"};

    {sub2&&<div style={{fontSize:10,color:color?lb[color]:"#bbb",marginTop:1}}>{sub2}</div>}

}
function Toggle({on,onChange,label}){

    </div>
    {label&&<span style={{fontSize:12,color:on?"#111":"#999",userSelect:"none"}}>{label}</span>}
  </div>;
}
function RetBox({title,items}){

    <div style={{fontSize:11,color:"#999",marginBottom:5,fontWeight:500,textTransform:"uppercase",letterSpacing:".04em"}}>{title}</div>

        {it.sub&&<div style={{fontSize:11,color:"#999",marginTop:2}}>{it.sub}</div>}
      </div>)}
    </div>
  </div>;
}
 
function App(){
  const [title,setTitle]=useState("김철민 은퇴 전략 시뮬레이터");
  const [subtitle,setSubtitle]=useState("2045 목표 · 부동산 + 금융자산 통합 플랜");
  const [editT,setEditT]=useState(false);
  const [saving,setSaving]=useState(false);
  const [apiLoading,setApiLoading]=useState(false);
  const [apiMsg,setApiMsg]=useState("");       // 저장/불러오기 메시지
  const [scenarioName,setScenarioName]=useState("기본 시나리오");
  const [scenarios,setScenarios]=useState([]); // 시나리오 목록
  const [showPanel,setShowPanel]=useState(false); // 시나리오 패널 표시
 
  // ── 부동산
  const [targetYr,setTargetYr]=useState(2045);
  const [hwYr,setHwYr]=useState(2029);const [hwRt,setHwRt]=useState(5);
  const [hwD,setHwD]=useState("");const [hwLoan,setHwLoan]=useState(4.5);
  const [gmYr,setGmYr]=useState(2030);const [gmRt,setGmRt]=useState(7);
  const [gmD,setGmD]=useState("");const [gmJ,setGmJ]=useState(4.85);
  const [newYr,setNewYr]=useState(2030);const [newP,setNewP]=useState(15);
  const [newD,setNewD]=useState("");const [newL,setNewL]=useState(3);const [newRt,setNewRt]=useState(8);
 
  // ── 주담대 상환 계산기
  const [mortRate,setMortRate]=useState(3.5);   // 이자율 %
  const [mortYears,setMortYears]=useState(30);  // 상환기간 년
  // 실제 대출금액은 newL(신규대출)을 기본으로, 별도 조정 슬라이더
  const [mortLoanAdj,setMortLoanAdj]=useState(0); // 신규대출 대비 조정(0=동일)
 
  // ── 현금
  const [salary,setSalary]=useState(810);const [bonusY,setBonusY]=useState(2760);
  const [living,setLiving]=useState(257);const [edu,setEdu]=useState(104);
  // 저축 종료 = 목표 퇴직 시점 연동 (오프셋으로 미세조정, -5~+5년)
  const [savEndOffset,setSavEndOffset]=useState(0);
  const [chM,setChM]=useState(()=>Object.fromEntries(CHANNELS.map(c=>[c.id,c.defM])));
  const [chRt,setChRt]=useState(()=>Object.fromEntries(CHANNELS.map(c=>[c.id,c.defRt])));
 
  // ── 주식
  const [stocks,setStocks]=useState([]);const [sN,setSN]=useState("");const [sM,setSM]=useState("");const [sR,setSR]=useState("");const [sid,setSid]=useState(0);
 
  // ── 퇴직연금
  const [dcOn,setDcOn]=useState(true);const [dcY,setDcY]=useState(1200);const [dcRt,setDcRt]=useState(5);const [dcEx,setDcEx]=useState(3000);
 
  // ── 국민연금·주택연금
  const [cmAge,setCmAge]=useState(68);const [cmPen,setCmPen]=useState(171);
  const [yrAge,setYrAge]=useState(68);const [yrPen,setYrPen]=useState(90);
  const [houseOn,setHouseOn]=useState(true);const [hAge,setHAge]=useState(68);const [hVal,setHVal]=useState(20);
 
  // ── 은퇴 후 금융자산 인출 전략
  const [infRate,setInfRate]=useState(2.5);      // 물가상승률
  const [divPct,setDivPct]=useState(50);         // 배당 포트 비중 %
  const [divRate,setDivRate]=useState(3.5);       // 배당 수익률 %
  const [sellPct,setSellPct]=useState(50);        // 매도 포트 비중 % (100-divPct)
  const [annSellPct,setAnnSellPct]=useState(4);  // 매도 포트에서 연간 매도 비율 %
  const [sellPortRt,setSellPortRt]=useState(8);   // 매도 포트 운용 수익률 %
 
  // ── 주담대 계산
  const mortLoan = Math.max(0, newL + mortLoanAdj); // 실제 대출금액 (억)
  const mortMonthly = calcMortgage(mortLoan, mortRate, mortYears); // 만원/월
 
  // ── 부동산 계산
  const hwSell=hwD!==""&&!isNaN(+hwD)?+hwD:Math.round(proj(8.25,hwRt,hwYr-2024)*10)/10;
  const gmSell=gmD!==""&&!isNaN(+gmD)?+gmD:Math.round(proj(8.1,gmRt,gmYr-2024)*10)/10;
  const newBuy=newD!==""&&!isNaN(+newD)?+newD:newP;
  const hwFirst=hwYr<gmYr;
  const hwTax=calcTax(hwSell,8.25);
  const gmTax=hwFirst?calcTax1(gmSell,8.1):calcTax(gmSell,8.1);
  const pool=Math.round(((hwSell-hwTax-hwLoan)+(gmSell-gmTax-gmJ))*100)/100;
  const aptFinal=Math.max(0,proj(newBuy,newRt,targetYr-newYr)-newL);
  const aptCost=16.35;
 
  // ── 현금흐름 (주담대 = 원리금균등상환액 자동 계산)
  const incomeY=salary*12+bonusY;
  const expY=(mortMonthly+living+edu)*12;
  const availY=incomeY-expY;
  const availM=availY/12;
 
  // ── 채널 누적
  const savEnd=Math.min(targetYr, Math.max(NOW+1, targetYr+savEndOffset)); // 퇴직연도 연동
  const savYrs=Math.max(0,savEnd-NOW);const extYrs=Math.max(0,targetYr-savEnd);const totalYrs=targetYr-NOW;
  const ca={};let fin=0,chMtot=0,prin=0;
  CHANNELS.forEach(ch=>{
    const m=chM[ch.id],r=chRt[ch.id];
    const ae=compSav(m*10000,r,savYrs);const acc=(ae*Math.pow(1+r/100,extYrs))/1e8;
    ca[ch.id]=Math.round(acc*10)/10;fin+=acc;chMtot+=m;prin+=m*12*savYrs;
  });
  let stk=0;stocks.forEach(s=>{const ae=compSav(s.m*10000,s.rt,savYrs);const acc=(ae*Math.pow(1+s.rt/100,extYrs))/1e8;stk+=acc;chMtot+=s.m;prin+=s.m*12*savYrs;});
  ca["stk"]=Math.round(stk*10)/10;fin+=stk;
  let dc=0;if(dcOn){const m=dcY/12;const ae=compSav(m*10000,dcRt,savYrs);const nv=(ae*Math.pow(1+dcRt/100,extYrs))/1e8;const ev=(dcEx/10000)*Math.pow(1+dcRt/100,totalYrs);dc=nv+ev;prin+=dcY*savYrs+dcEx;}
  ca["dc"]=Math.round(dc*10)/10;fin+=dc;fin=Math.round(fin*10)/10;
  const prin억=prin/10000;
  const chY=chMtot*12;const allY=chY+(dcOn?dcY:0);
  const usePct=availY>0?allY/availY*100:0;const remY=availY-allY;
  const aptCumR=Math.round(cumR(aptFinal,aptCost)*10)/10;const aptAnnR=Math.round(cagr(aptFinal,aptCost,totalYrs)*10)/10;
  const finCumR=Math.round(cumR(fin,prin억)*10)/10;const finAnnR=Math.round(cagr(fin,prin억,totalYrs)*10)/10;
  const grand=aptFinal+fin;const totC=aptCost+prin억;
  const totCumR=Math.round(cumR(grand,totC)*10)/10;const totAnnR=Math.round(cagr(grand,totC,totalYrs)*10)/10;
 
  // ── 은퇴 후 금융자산 인출 전략 계산
  const divPortAmt = fin * (divPct/100);           // 배당 포트 (억)
  const sellPortAmt = fin * ((100-divPct)/100);    // 매도 포트 (억)
  const divIncomeY억 = divPortAmt * divRate/100;   // 연 배당소득 (억)
  const divIncomeM만 = divIncomeY억*10000/12;      // 월 배당소득 (만원)
  const sellIncomeY억 = sellPortAmt * annSellPct/100; // 연 매도소득 (억)
  const sellIncomeM만 = sellIncomeY억*10000/12;    // 월 매도소득 (만원)
  // 매도 후 원금 유지에 필요한 수익률 = 연간매도비율 (원금보전 목표)
  const needRet = annSellPct; // 단순: 매도율만큼 수익이 나야 원금 보전
  // 현재가치 환산 (목표연도→현재)
  const pvFactor = Math.pow(1+infRate/100, totalYrs);
  const divIncomeM_pv = divIncomeM만/pvFactor;
  const sellIncomeM_pv = sellIncomeM만/pvFactor;
  const divIncomeY_pv = divIncomeY억*10000/pvFactor; // 만원
  const sellIncomeY_pv = sellIncomeY억*10000/pvFactor;
 
  // ── 국민연금·주택연금
  const penSum=cmPen+yrPen;
  const houseMon원=houseOn?Math.round(Math.min(hVal,12)*1e8*(0.0042+(hAge-60)*0.0002)):0;
  const penPv만 = penSum/pvFactor;

  function addStk(){const m=parseFloat(sM),r=parseFloat(sR);if(!sN.trim()||isNaN(m)||isNaN(r))return;setStocks(p=>[...p,{id:sid,name:sN.trim(),m,rt:r}]);setSid(n=>n+1);setSN("");setSM("");setSR("");}

  }
 
  // ── 불러온 객체를 state에 복원

    if(s.yrPen!==undefined) setYrPen(s.yrPen);
    if(s.houseOn!==undefined) setHouseOn(s.houseOn);
    if(s.hAge!==undefined) setHAge(s.hAge);
    if(s.hVal!==undefined) setHVal(s.hVal);
    if(s.infRate!==undefined) setInfRate(s.infRate);
    if(s.divPct!==undefined) setDivPct(s.divPct);
    if(s.divRate!==undefined) setDivRate(s.divRate);
    if(s.sellPortRt!==undefined) setSellPortRt(s.sellPortRt);
    if(s.annSellPct!==undefined) setAnnSellPct(s.annSellPct);
  }
 
  // ── 시나리오 목록 불러오기
  async function fetchList() {
    try {
      const res = await fetch(API_URL + "?action=list");
      const json = await res.json();
      if(json.ok) setScenarios(json.scenarios);
    } catch(e) { console.error(e); }
  }
 
  // ── 저장
  async function apiSave() {
    setApiLoading(true); setApiMsg("");
    try {
      const res = await fetch(API_URL, {
        method:"POST",
        body: JSON.stringify({ action:"save", name:scenarioName, data:getState() }),
      });
      const json = await res.json();
      if(json.ok) {
        setApiMsg("✅ '" + scenarioName + "' 저장 완료!");
        fetchList();
      } else {
        setApiMsg("❌ 저장 실패: " + json.error);
      }
    } catch(e) {
      setApiMsg("❌ 네트워크 오류: " + e.message);
    } finally { setApiLoading(false); setTimeout(()=>setApiMsg(""),4000); }
  }
 
  // ── 불러오기
  async function apiLoad(name) {
    setApiLoading(true); setApiMsg("");
    try {
      const res = await fetch(API_URL + "?action=load&name=" + encodeURIComponent(name));
      const json = await res.json();
      if(json.ok) {
        applyState(json.data);
        setScenarioName(json.name);
        setApiMsg("✅ '" + json.name + "' 불러오기 완료! (" + json.timestamp + ")");
        setShowPanel(false);
      } else {
        setApiMsg("❌ 불러오기 실패: " + json.error);
      }
    } catch(e) {
      setApiMsg("❌ 네트워크 오류: " + e.message);
    } finally { setApiLoading(false); setTimeout(()=>setApiMsg(""),5000); }
  }
 
  // ── 삭제
  async function apiDelete(name) {
    if(!confirm("'" + name + "' 시나리오를 삭제할까요?")) return;
    setApiLoading(true);
    try {
      const res = await fetch(API_URL + "?action=delete&name=" + encodeURIComponent(name));
      const json = await res.json();
      if(json.ok) { setApiMsg("🗑 '" + name + "' 삭제 완료"); fetchList(); }
      else setApiMsg("❌ 삭제 실패: " + json.error);
    } catch(e) {
      setApiMsg("❌ 네트워크 오류: " + e.message);
    } finally { setApiLoading(false); setTimeout(()=>setApiMsg(""),3000); }
  }
 
  // 초기 로드 시 목록 가져오기
  useEffect(()=>{ fetchList(); },[]);

    setSaving(true);
    const st=document.createElement("style");
    st.innerHTML="@media print{.np{display:none!important;}@page{margin:8mm;}}";
    document.head.appendChild(st);
    setTimeout(()=>{window.print();setTimeout(()=>{document.head.removeChild(st);setSaving(false);},500);},100);
  }

            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#888",marginTop:2}}>
              <span>■ 배당 포트 {f억(divPortAmt)}</span>
              <span>■ 매도 포트 {f억(sellPortAmt)}</span>
            </div>
          </div>
 
          <div style={G2}>
            {/* 배당 포트 */}
            <div style={{background:"#EEEDFE",borderRadius:8,padding:12,border:"0.5px solid #AFA9EC"}}>
              <div style={{fontSize:11,fontWeight:600,color:"#534AB7",marginBottom:10}}>📈 배당 포트 ({divPct}%) — {f억(divPortAmt)}</div>
              <Slider label="배당 수익률 (%/년)" min={0} max={10} step={0.1} value={divRate} onChange={setDivRate} display={`${divRate}%`} color="#534AB7"/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:10}}>
                <div style={{background:"#fff",borderRadius:6,padding:"8px 10px"}}>
                  <div style={{fontSize:10,color:"#534AB7",marginBottom:2}}>연 배당소득</div>
                  <div style={{fontSize:15,fontWeight:700,color:"#3C3489"}}>{fM(Math.round(divIncomeY억*10000))}</div>
                  <div style={{fontSize:10,color:"#9B8FE0",marginTop:2}}>현재가치 {fM(Math.round(divIncomeY_pv))}</div>
                </div>
                <div style={{background:"#fff",borderRadius:6,padding:"8px 10px"}}>
                  <div style={{fontSize:10,color:"#534AB7",marginBottom:2}}>월 배당소득</div>
                  <div style={{fontSize:15,fontWeight:700,color:"#3C3489"}}>{fM(Math.round(divIncomeM만))}</div>
                  <div style={{fontSize:10,color:"#9B8FE0",marginTop:2}}>현재가치 {fM(Math.round(divIncomeM_pv))}</div>
                </div>
              </div>
            </div>
 
            {/* 매도 포트 */}
            <div style={{background:"#E1F5EE",borderRadius:8,padding:12,border:"0.5px solid #5DCAA5"}}>
              <div style={{fontSize:11,fontWeight:600,color:"#0F6E56",marginBottom:10}}>💹 매도 포트 ({100-divPct}%) — {f억(sellPortAmt)}</div>
              <Slider label="연간 매도 비율 (%)" min={0} max={20} step={0.5} value={annSellPct} onChange={setAnnSellPct} display={`${annSellPct}%`} color="#0F6E56"/>
              <Slider label="매도 포트 운용 수익률 (%/년)" min={0} max={20} step={0.5} value={sellPortRt} onChange={setSellPortRt} display={`${sellPortRt}%`} color="#0F6E56"/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:10}}>
                <div style={{background:"#fff",borderRadius:6,padding:"8px 10px"}}>
                  <div style={{fontSize:10,color:"#0F6E56",marginBottom:2}}>연 매도소득</div>
                  <div style={{fontSize:15,fontWeight:700,color:"#085041"}}>{fM(Math.round(sellIncomeY억*10000))}</div>
                  <div style={{fontSize:10,color:"#5DCAA5",marginTop:2}}>현재가치 {fM(Math.round(sellIncomeY_pv))}</div>
                </div>
                <div style={{background:"#fff",borderRadius:6,padding:"8px 10px"}}>
                  <div style={{fontSize:10,color:"#0F6E56",marginBottom:2}}>월 매도소득</div>
                  <div style={{fontSize:15,fontWeight:700,color:"#085041"}}>{fM(Math.round(sellIncomeM만))}</div>
                  <div style={{fontSize:10,color:"#5DCAA5",marginTop:2}}>현재가치 {fM(Math.round(sellIncomeM_pv))}</div>
                </div>
              </div>
 
              {/* 순수익 (비상자금) */}
              {(()=>{
                const netRt = sellPortRt - annSellPct; // 순 추가 수익률
                const netY억 = sellPortAmt * netRt/100; // 연 순수익 (억)
                const netM만 = netY억*10000/12;          // 월 순수익 (만원)
                const netColor = netRt >= 0 ? "#085041" : "#993C1D";
                const netBg    = netRt >= 0 ? "#E1F5EE" : "#FAECE7";
                const netBorder= netRt >= 0 ? "#5DCAA5" : "#F0997B";
                return <div style={{marginTop:8,padding:"10px 12px",background:netBg,borderRadius:6,border:`0.5px solid ${netBorder}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                    <div>
                      <div style={{fontSize:10,color:netColor,marginBottom:1,fontWeight:600}}>
                        {netRt >= 0 ? "💰 순 추가수익 (비상자금)" : "⚠️ 원금 감소 중"}
                      </div>
                      <div style={{fontSize:11,color:"#888"}}>
                        수익률 {sellPortRt}% − 매도율 {annSellPct}% = <strong style={{color:netColor}}>{netRt>=0?"+":""}{(Math.round(netRt*10)/10).toFixed(1)}%</strong>
                      </div>
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    <div style={{background:"rgba(255,255,255,0.7)",borderRadius:5,padding:"6px 8px"}}>
                      <div style={{fontSize:10,color:netColor,marginBottom:1}}>연간 순수익</div>
                      <div style={{fontSize:14,fontWeight:700,color:netColor}}>{netRt>=0?"+":""}{fM(Math.round(Math.abs(netY억*10000)))}</div>
                      <div style={{fontSize:10,color:"#aaa"}}>현재가치 {fM(Math.round(Math.abs(netY억*10000)/pvFactor))}</div>
                    </div>
                    <div style={{background:"rgba(255,255,255,0.7)",borderRadius:5,padding:"6px 8px"}}>
                      <div style={{fontSize:10,color:netColor,marginBottom:1}}>월간 순수익</div>
                      <div style={{fontSize:14,fontWeight:700,color:netColor}}>{netRt>=0?"+":""}{fM(Math.round(Math.abs(netM만)))}</div>
                      <div style={{fontSize:10,color:"#aaa"}}>현재가치 {fM(Math.round(Math.abs(netM만)/pvFactor))}</div>
                    </div>
                  </div>
                  {netRt < 0 && <div style={{fontSize:10,color:"#993C1D",marginTop:6}}>원금 보전을 위해 수익률을 최소 {(Math.round(annSellPct*10)/10).toFixed(1)}% 이상으로 설정하세요</div>}
                </div>;
              })()}
            </div>
          </div>
        </div>
 
        {/* 국민연금 + 주택연금 카드 */}
        <div style={{...G3,marginTop:12}}>
          <MC label="국민연금 합산 (월)" value={`${fM(penSum)}/월`}
            sub={`철민 ${1986+cmAge}년 / 유리 ${1989+yrAge}년`}
            sub2={`현재가치 ${fM(Math.round(penPv만))}/월`}
            color="purple"/>
          <MC label={houseOn?"주택연금 (월)":"주택연금 (미가입)"}
            value={houseOn?f원(houseMon원):"—"}
            sub={houseOn?`가입 나이 만 ${hAge}세`:"토글로 활성화"}
            sub2={houseOn?`현재가치 ${fM(Math.round(housePv만))}/월`:""}
            color={houseOn?"blue":undefined}/>
          <div style={{background:"#EAF3DE",borderRadius:8,padding:"10px 12px"}}>
            <div style={{fontSize:11,color:"#3B6D11",marginBottom:3}}>금융자산 총 월소득</div>
            <div style={{fontSize:16,fontWeight:700,color:"#27500A"}}>{fM(Math.round(divIncomeM만+sellIncomeM만))}/월</div>
            <div style={{fontSize:11,color:"#3B6D11",marginTop:2}}>배당 {fM(Math.round(divIncomeM만))} + 매도 {fM(Math.round(sellIncomeM만))}</div>
            <div style={{fontSize:10,color:"#639922",marginTop:1}}>현재가치 {fM(Math.round(divIncomeM_pv+sellIncomeM_pv))}/월</div>
          </div>
        </div>
 
        {/* 은퇴 후 총 월수입 */}
        <div style={{...G2,marginTop:10}}>
          <div style={{background:"#EAF3DE",borderRadius:8,padding:"12px 14px"}}>
            <div style={{fontSize:11,color:"#3B6D11",marginBottom:4}}>은퇴 후 월 총수입 (국민연금 포함)</div>
            <div style={{fontSize:20,fontWeight:700,color:"#27500A"}}>{fM(Math.round(totalRetireM만))}/월</div>
            <div style={{fontSize:11,color:"#3B6D11",marginTop:4}}>국민연금 {fM(penSum)} + 배당 {fM(Math.round(divIncomeM만))} + 매도 {fM(Math.round(sellIncomeM만))} + 주택연금 {fM(Math.round(houseMon원/10000))}</div>
            <div style={{fontSize:11,color:"#639922",marginTop:2}}>현재가치 기준: {fM(Math.round(totalRetireM_pv))}/월</div>
          </div>
          <div style={{background:"#FAECE7",borderRadius:8,padding:"12px 14px"}}>
            <div style={{fontSize:11,color:"#993C1D",marginBottom:4}}>은퇴 후 월 총수입 (국민연금 제외)</div>
            <div style={{fontSize:20,fontWeight:700,color:"#712B13"}}>{fM(Math.round(divIncomeM만+sellIncomeM만+houseMon원/10000))}/월</div>
            <div style={{fontSize:11,color:"#993C1D",marginTop:4}}>배당 + 매도 + 주택연금 (연금 개시 전 공백기)</div>
            <div style={{fontSize:11,color:"#D85A30",marginTop:2}}>현재가치 기준: {fM(Math.round(divIncomeM_pv+sellIncomeM_pv+housePv만))}/월</div>
          </div>
        </div>
      </div>
 
      {/* ── 총자산 */}
      <div style={{...P,borderColor:"rgba(0,0,0,0.15)"}}><div style={PT}>은퇴 목표 — 총자산 및 수익률 종합</div>
        <div style={G3}>
          <MC label="부동산 (대출차감)" value={f억(aptFinal)} sub={`CAGR ${p1(aptAnnR)} · 누적 ${p1(aptCumR)}`} color="green"/>
          <MC label="금융자산 합계" value={f억(fin)} sub={`CAGR ${p1(finAnnR)} · 누적 ${p1(finCumR)}`} color="blue"/>
          <div style={{background:"#EAF3DE",borderRadius:8,padding:"10px 12px"}}>
            <div style={{fontSize:11,color:"#3B6D11",marginBottom:3}}>총자산 합계</div>
            <div style={{fontSize:20,fontWeight:700,color:"#27500A"}}>{f억(grand)}</div>
            <div style={{fontSize:11,color:"#3B6D11",marginTop:2}}>{targetYr}년 만 {targetYr-1986}세 · CAGR {p1(totAnnR)}</div>
          </div>
        </div>
        <div style={{marginTop:14}}>
          <RetBox title="부동산" items={[
            {label:"투자 원가",value:f억(aptCost),sub:"화랑대+광명"},
            {label:"목표연도 가치",value:f억(aptFinal),sub:`${targetYr}년 (대출차감)`},
            {label:"누적 수익률",value:p1(aptCumR),color:"#27500A"},
            {label:"연평균 CAGR",value:p1(aptAnnR),sub:`${totalYrs}년 기준`,color:"#27500A"},
          ]}/>
          <RetBox title="금융자산" items={[
            {label:"총 납입 원금",value:f억(prin억),sub:`${savYrs}년 납입`},
            {label:"목표연도 금융자산",value:f억(fin),sub:`${targetYr}년 복리`},
            {label:"누적 수익률",value:p1(finCumR),color:"#0C447C"},
            {label:"연평균 CAGR",value:p1(finAnnR),sub:`${totalYrs}년`,color:"#0C447C"},
          ]}/>
          <RetBox title="전체 자산 종합" items={[
            {label:"총 투입 원가",value:f억(totC),sub:"부동산+금융"},
            {label:"목표연도 총자산",value:f억(grand),sub:`${targetYr}년`},
            {label:"누적 수익률",value:p1(totCumR),color:"#085041"},
            {label:"연평균 CAGR",value:p1(totAnnR),sub:`${totalYrs}년`,color:"#085041"},
          ]}/>
        </div>
        {/* 채널 구성 바 */}
        <div style={{marginTop:14}}>
          <div style={{fontSize:11,color:"#999",marginBottom:8}}>금융자산 채널별 구성</div>
          {[...CHANNELS.map(c=>({id:c.id,label:c.label,color:c.color})),{id:"stk",label:"개별 주식",color:"#D85A30"},{id:"dc",label:"퇴직연금",color:"#C06030"}].map(ch=>{
            const v=ca[ch.id]||0,pct=fin>0?Math.round(v/fin*1000)/10:0;
            return <div key={ch.id} style={{marginBottom:6}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
                <span style={{display:"flex",alignItems:"center",gap:5}}>
                  <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:ch.color}}/>
                  {ch.label}
                </span>
                <span style={{color:"#999"}}>{f억(v)} · {pct}%</span>
              </div>
              <div style={{height:6,background:"rgba(0,0,0,0.07)",borderRadius:3,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${pct}%`,background:ch.color,borderRadius:3}}/>
              </div>
            </div>;})}
        </div>
      </div>
      <div className="np" style={{textAlign:"center",fontSize:11,color:"#bbb",paddingBottom:12}}>본 시뮬레이터는 참고용 추정치입니다. 실제 세금·대출은 전문가 상담을 권장합니다.</div>
    </div>
  </div>;
}
 
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
